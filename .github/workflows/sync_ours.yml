name: 自动同步上游并保留我的修改
on:
  workflow_dispatch: # 手动触发按钮

permissions:
  contents: write   # 允许修改代码内容 [cite: 2026-01-17]
  workflows: write  # 允许同步上游对工作流脚本的修改

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出 Test 分支代码
        uses: actions/checkout@v4
        with:
          ref: Test # 对应您的 Test 分支
          fetch-depth: 0

      - name: 配置 Git 环境
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 执行合并（优先保留我的代码）
        run: |
          # 添加原版上游仓库地址
          git remote add upstream https://github.com/LegadoTeam/legado.git
          git fetch upstream
          # 使用 -X ours 策略，冲突时强制保留您的听书和逻辑优化，严禁删除原有逻辑 [cite: 2026-01-17]
          git merge upstream/master -X ours --allow-unrelated-histories

      - name: 推送更新回 Test 分支
        run: |
          git push origin Test
