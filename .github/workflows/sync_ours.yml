name: 自动同步上游并保留我的修改
on:
  workflow_dispatch: # 手动触发按钮

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出 Test 分支代码
        uses: actions/checkout@v4
        with:
          ref: Test # 指定操作 Test 分支
          fetch-depth: 0

      - name: 配置 Git 环境
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 执行合并（优先保留我的代码）
        run: |
          # 添加上游仓库地址
          git remote add upstream https://github.com/LegadoTeam/legado.git
          git fetch upstream
          # 使用 -X ours 策略：若有代码冲突，自动选择保留您的修改
          git merge upstream/master -X ours --allow-unrelated-histories

      - name: 推送更新回 Test 分支
        run: |
          git push origin Test #
