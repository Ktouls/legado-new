name: 自动同步上游并保留我的修改
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出 Test 分支代码
        uses: actions/checkout@v4
        with:
          ref: Test
          fetch-depth: 0

      - name: 配置 Git 环境
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 执行代码合并与脚本保护
        run: |
          git remote add upstream https://github.com/LegadoTeam/legado.git
          git fetch upstream
          
          # 使用 --no-commit 确保我们有修改合并内容的机会 [cite: 2026-01-17]
          git merge upstream/master -X ours --allow-unrelated-histories --no-commit || true
          
          # 撤销对工作流脚本的任何自动修改
          git checkout HEAD -- .github/workflows
          
          git commit -m "Merge upstream/master and protect local workflows" || echo "No changes to commit"

      - name: 推送更新回 Test 分支
        run: |
          git push origin Test
