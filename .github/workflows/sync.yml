name: 自动同步上游 (以我为主)
on: workflow_dispatch # 手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Test # 作用于 Test 分支
          fetch-depth: 0
      - name: 配置 Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: 合并上游
        run: |
          git remote add upstream https://github.com/LegadoTeam/legado.git
          git fetch upstream
          git merge upstream/master -X ours --allow-unrelated-histories
          git push origin Test
